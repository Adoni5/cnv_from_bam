[package]
name = "cnv_from_bam"
version = "0.4.6"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "cnv_from_bam"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.25.0", features = ["extension-module"] }
noodles = { version = "0.99.0", features = ["bam", "sam", "csi", "bgzf"] }
noodles-bgzf = { version = "0.41.0", features = ["libdeflate"] }
fnv = "1.0.7"
indicatif = "0.17.7"
rayon = "1.8.0"
log = "0.4.20"
ctrlc = "3.4.1"
once_cell = "1.19.0"
natord = "1.0.9"
bstr = "1.9.0"

[build-dependencies]
pyo3-build-config = "0.25.0"

[features]
extension-module = ["pyo3/extension-module"]
default = ["extension-module"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 0
